services:
  app:
    build: .
    container_name: cad_version_manager_app
    restart: unless-stopped
    environment:
      - RAILS_ENV=production
      - DATABASE_URL=postgresql://caduser:cadpass123@db:5432/cad_version_manager_production
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - RAILS_LOG_LEVEL=info
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
      - app_tmp:/app/tmp
    networks:
      - cad_net

  db:
    image: postgres:16-alpine
    container_name: cad_version_manager_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=cad_version_manager_production
      - POSTGRES_USER=caduser
      - POSTGRES_PASSWORD=cadpass123
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caduser -d cad_version_manager_production"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cad_net

volumes:
  db_data:
  app_storage:
  app_tmp:

networks:
  cad_net:
    driver: bridge
