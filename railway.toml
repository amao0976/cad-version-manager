# Railway 部署配置
# 后端 Rails API 服务

[service]
  name = "cad-version-api"
  rootDirectory = ""

[build]
  builder = "nixpacks"
  buildCommand = "bundle install && bundle exec rails assets:precompile"

[deploy]
  startCommand = "bundle exec puma -b tcp://0.0.0.0:$PORT -e production"

[env]
  RAILS_ENV = "production"
  RAILS_LOG_TO_STDOUT = "true"
